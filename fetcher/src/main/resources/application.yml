server:
  port: ${FETCHER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: bank-mas-image-fetcher
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    com.bankmas.imagesearch.fetcher: INFO

fetcher:
  http:
    # Connection timeout for both Openverse calls and image downloads.
    connect-timeout: ${FETCHER_HTTP_CONNECT_TIMEOUT:10s}
    # Redirects are followed through the same guarded DNS resolver and capped here.
    max-redirects: ${FETCHER_HTTP_MAX_REDIRECTS:5}
  openverse:
    base-url: ${OPENVERSE_BASE_URL:https://api.openverse.org}
    # Optional API credentials. When both are empty the client calls the
    # anonymous API tier without an Authorization header.
    client-id: ${OPENVERSE_CLIENT_ID:}
    client-secret: ${OPENVERSE_CLIENT_SECRET:}
    page-size: ${OPENVERSE_PAGE_SIZE:20}
    max-pages-per-class: ${OPENVERSE_MAX_PAGES_PER_CLASS:5}
    request-timeout: ${OPENVERSE_REQUEST_TIMEOUT:8s}
    max-response-bytes: ${OPENVERSE_MAX_RESPONSE_BYTES:2097152}
    # Minimum spacing between two Openverse requests (rate limiting / pacing).
    min-request-interval: ${OPENVERSE_MIN_REQUEST_INTERVAL:250ms}
    license-type: ${OPENVERSE_LICENSE_TYPE:}
    user-agent: ${OPENVERSE_USER_AGENT:bank-mas-image-fetcher/0.1.0}
  download:
    timeout: ${FETCHER_DOWNLOAD_TIMEOUT:20s}
    max-bytes: ${FETCHER_DOWNLOAD_MAX_BYTES:8388608}
    max-pixels: ${FETCHER_DOWNLOAD_MAX_PIXELS:25000000}
    user-agent: ${FETCHER_DOWNLOAD_USER_AGENT:bank-mas-image-fetcher/0.1.0}
    # Reject image URLs that resolve to loopback / private / link-local hosts.
    allow-private-addresses: ${FETCHER_ALLOW_PRIVATE_ADDRESSES:false}
  retry:
    openverse-max-attempts: ${FETCHER_OPENVERSE_MAX_ATTEMPTS:3}
    download-max-attempts: ${FETCHER_DOWNLOAD_MAX_ATTEMPTS:2}
    base-delay: ${FETCHER_RETRY_BASE_DELAY:500ms}
    max-delay: ${FETCHER_RETRY_MAX_DELAY:8s}
    jitter-ratio: ${FETCHER_RETRY_JITTER_RATIO:0.25}
    max-retry-after: ${FETCHER_RETRY_MAX_RETRY_AFTER:30s}
  jobs:
    worker-threads: ${FETCHER_JOB_WORKER_THREADS:2}
    queue-capacity: ${FETCHER_JOB_QUEUE_CAPACITY:32}
    max-retained-jobs: ${FETCHER_MAX_RETAINED_JOBS:200}
    manifest-save-attempts: ${FETCHER_MANIFEST_SAVE_ATTEMPTS:2}
    manifest-retry-delay: ${FETCHER_MANIFEST_RETRY_DELAY:500ms}
  events:
    # SSE connection lifetime; clients reconnect after this timeout.
    timeout: ${FETCHER_SSE_TIMEOUT:30m}
    heartbeat-interval-ms: ${FETCHER_SSE_HEARTBEAT_INTERVAL_MS:15000}
    # Bounded subscriber count; excess connections receive HTTP 429.
    max-subscribers: ${FETCHER_SSE_MAX_SUBSCRIBERS:8}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:bank-mas}
    path-style-access: ${MINIO_PATH_STYLE_ACCESS:true}
    images-prefix: ${MINIO_IMAGES_PREFIX:images/bank-mas/}
    jobs-prefix: ${MINIO_JOBS_PREFIX:jobs/bank-mas/}
