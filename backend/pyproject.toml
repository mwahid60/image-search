[project]
name = "bank-mas-image-search-backend"
version = "0.1.0"
description = "FastAPI backend for Bank MAS image ingestion and vector search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "minio==7.2.20",
    "pillow==13.0.0",
    "pymilvus==2.6.9",
    "milvus-lite==2.5.1",
    "setuptools>=70,<81",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
